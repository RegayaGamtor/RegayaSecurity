# ============================================================
#  RegayaSecurity - messages.yml
#  Gunakan kode warna '&' (contoh: &a hijau, &c merah) atau &#RRGGBB.
#  Placeholder (%player%, %seconds%, dll.) harus dipertahankan.
#  Nilai dari pemain (nama, alasan) otomatis dibersihkan dari kode warna.
#  PENTING: biarkan setiap nilai tetap berada di dalam tanda kutip.
# ============================================================

prefix: "&8[&bRegayaSecurity&8] "

